name: Alerta Cripto

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar notificação de teste agora"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alerta-cripto
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar preços e alertar
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste }}
        run: python3 monitor_cripto.py
      - name: Salvar estado dos alertas
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: atualizar alertas"
            git pull --rebase
            git push
          fi
